[project]
name = "kumo_bot"
version = "1.3.0.0a3"
description = "A random bot for featured webseries discussion."
authors = [{ name = "Tech. TTGames", email = "50541739+Tech-TTGames@users.noreply.github.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = { text = "EPL-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "discord-py (>=2.6.3,<3.0.0)",
    "fanficfare (>=4.48.0,<5.0.0)",
]

[project.urls]
repository = "https://github.com/Tech-TTGames/KumoFeaturedBot"

[dependency-groups]
dev = [
    "yapf>=0.43.0,<0.44",
    "pylint>=4.0.5,<5",
]

[tool.yapf]
based_on_style = "google"
column_limit = 120

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
